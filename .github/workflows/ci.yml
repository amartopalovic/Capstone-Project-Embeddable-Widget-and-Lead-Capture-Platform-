# CI baseline (blueprint section 15.3).
#
# HONESTY RULE FOR THIS FILE: every step below runs a real check against real
# code that exists today. Checks the blueprint requires but that cannot run yet
# are listed in the "not-yet-wired" comment block at the bottom as TODOs with
# their owning stage. They are deliberately NOT present as no-op steps, because
# a step that always passes without doing anything is false evidence.
#
# This workflow does not deploy anything. Deployment is Stage 14.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Lint every workspace
        run: npm run lint

      - name: Type-check every workspace
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build every workspace
        run: npm run build

      - name: Fail if the build produced no artifacts
        # Guards against a build script silently succeeding without emitting
        # anything, which would make the build step meaningless.
        run: |
          set -euo pipefail
          for artifact in \
            packages/contracts/dist/index.js \
            packages/widget-runtime/dist/widget-runtime.js \
            apps/server/dist/index.js             apps/server/dist/composition.js \
            apps/web/dist/index.html \
            apps/demo/dist/index.html
          do
            if [ ! -f "$artifact" ]; then
              echo "Expected build artifact is missing: $artifact"
              exit 1
            fi
            echo "Found $artifact"
          done

      - name: Report public widget bundle sizes
        # Blueprint 8.3 asks for loader and runtime size to be TRACKED in CI.
        # The budgets themselves are asserted by the unit suite above, which
        # fails the build if either grows past its ceiling; this step prints the
        # numbers so a reviewer can see the trend in the log rather than only
        # finding out when a limit is breached.
        run: |
          set -euo pipefail
          node -e "
            const { gzipSync } = require('node:zlib');
            const { readFileSync, statSync } = require('node:fs');
            for (const file of [
              'packages/widget-runtime/dist/widget-runtime.iife.js',
              'packages/widget-runtime/dist/widget-runtime.js',
            ]) {
              const source = readFileSync(file);
              console.log(
                file.padEnd(58),
                String(statSync(file).size).padStart(7) + ' B raw',
                String(gzipSync(source).length).padStart(7) + ' B gzip',
              );
            }
          "

  integration:
    name: Integration tests (real MongoDB and Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # The same docker-compose.yml developers use locally is reused here rather
      # than declaring separate `services:` containers. MongoDB must run as a
      # replica set for the multi-document transactions the blueprint depends on,
      # and the compose healthcheck already performs rs.initiate(). Duplicating
      # that init as a bespoke CI-only service would let the two topologies drift.
      - name: Start MongoDB, Redis, and Mailpit
        run: docker compose up -d --wait mongo redis mailpit

      - name: Show service state
        run: docker compose ps

      - name: Confirm MongoDB is a replica set and supports transactions
        run: |
          set -euo pipefail
          docker compose exec -T mongo mongosh --quiet --eval '
            const status = rs.status();
            if (status.ok !== 1) { throw new Error("replica set not ready"); }
            print("replica set " + status.set + " member " + status.members[0].stateStr);
          '

      - name: Run integration tests
        run: npm run test:integration
        env:
          # From the CI host, the advertised replica set member name is not
          # resolvable, so a direct connection is used. Transactions still work
          # because the target is the primary.
          TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          TEST_REDIS_URL: redis://localhost:6379
          REDIS_URL: redis://localhost:6379
          MAILPIT_SMTP_HOST: localhost
          MAILPIT_SMTP_PORT: '1025'
          MAILPIT_API: http://localhost:8025

      - name: Tear down services
        if: always()
        run: docker compose down -v

  e2e:
    name: Browser end-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Build the workspace packages
        run: npm run build:packages

      - name: Start MongoDB, Redis, and Mailpit
        run: docker compose up -d --wait mongo redis mailpit

      # Playwright starts the API and web servers itself, per its webServer
      # config, so only the infrastructure is started here.
      - name: Run browser end-to-end and accessibility tests
        run: npm run test:e2e
        env:
          CI: 'true'
          MAILPIT_API: http://localhost:8025

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down services
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Audit production dependencies
        # Lockfile integrity is enforced by `npm ci` itself, which fails when
        # package.json and package-lock.json disagree.
        run: npm audit --audit-level=high

# -----------------------------------------------------------------------------
# NOT YET WIRED - required by blueprint section 15.3 but not achievable today.
# Each is added by the stage that first makes it real. None of these is stubbed
# as a passing step.
#
#   - BullMQ queue integration tests                               -> Stage 9
#   - Browser E2E for the widget runtime and submission journeys   -> Stage 6
#   - PDF acceptance probes                                        -> Stage 7
#   - Widget bundle-size budgets and artifact checks               -> Stage 6
#   - Full browser matrix and the manual WCAG 2.2 AA audit         -> Stage 13
#   - Secret scanning and vulnerability gating                     -> Stage 13
#   - Deployment gate to the protected main branch                 -> Stage 14
#
# Wired in Stage 2: the `integration` job runs real Mongo/Redis tests.
# Wired in Stage 3b: the `e2e` job runs browser journeys plus axe accessibility
# checks on every auth page.
# -----------------------------------------------------------------------------
