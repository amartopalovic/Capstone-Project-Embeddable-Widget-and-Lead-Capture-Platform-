# =============================================================================
# capstone.yaml - machine-readable evaluation manifest
# =============================================================================
#
# STATUS: Stage 0 skeleton. Every command and URL below is `TBD`.
#
# NOTHING in this file is runnable yet. There is no package.json, no Docker
# Compose file, no test suite, and no deployment. A `TBD` value means the value
# does not exist - it is NOT a command that will silently fail, and it must not
# be executed or reported as passing.
#
# Each field carries a `filled_in_by` note naming the stage that will replace
# the placeholder with a real, verified value. The final pass happens in
# Stage 15 (evaluation evidence and portfolio release), when a clean-machine
# evaluator must be able to run every command here successfully.
# =============================================================================

