# -----------------------------------------------------------------------------
# The six mandatory acceptance probes. All are currently unproven.
# Detailed status and future transcripts live in EVIDENCE.md.
# -----------------------------------------------------------------------------
acceptance_probes:
  - id: valid-second-origin-submission
    required_proof: >-
      2xx response, durable Submission Event, visible Contact and dashboard result.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: malformed-and-oversized-input
    required_proof: Clean 4xx JSON errors, never a 500.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: burst-traffic
    required_proof: >-
      429 responses appear while a later legitimate request still succeeds.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: geo-fallback
    required_proof: >-
      Provider A down and B enriches; both down and the submission is still
      stored without geo.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: side-effect-failure
    required_proof: >-
      Email or webhook throws and the primary submission remains successful
      and stored.
    status: not_implemented
    planned_stage: 7
    completed_stage: 9
    command: TBD
  - id: honeypot
    required_proof: >-
      Bot-like submission receives a generic outcome but creates no Contact.
    status: not_implemented
    planned_stage: 7
    command: TBD

# -----------------------------------------------------------------------------
# Honest posture of the hosted deployment.
# -----------------------------------------------------------------------------
disclosures:
  synthetic_data_only: true
  service_level_agreement: none
  hosting_may_sleep: true
  automated_cloud_backup: false
  repository_is_npm_workspaces_monorepo: true
  monorepo_caveat: >-
    The capstone brief requires one dedicated repository and warns against a
    monorepo. This project uses npm workspaces inside one dedicated repository
    because every workspace belongs to this single application. If an evaluator
    interprets "no monorepo" literally, this is a known submission risk. See
    README section 3.
