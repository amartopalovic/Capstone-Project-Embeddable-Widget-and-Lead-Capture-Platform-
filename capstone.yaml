# =============================================================================
# capstone.yaml - machine-readable evaluation manifest
# =============================================================================
#
# STATUS: Stage 7 complete (hardened public submission path). All six acceptance probes now
# pass locally. Install, run, seed,
# migrate, lint, typecheck, build, unit, integration, and browser E2E commands below are REAL
# and verified. The six acceptance probes and every production URL remain `TBD`.
#
# A `TBD` value means the value does not exist - it is NOT a command that will
# silently fail, and it must not be executed or reported as passing.
#
# Each field carries a `filled_in_by` note naming the stage that will replace
# the placeholder with a real, verified value. The final pass happens in
# Stage 15 (evaluation evidence and portfolio release), when a clean-machine
# evaluator must be able to run every command here successfully.
# =============================================================================

schema_version: 1

project:
  name: Embeddable Widget & Lead-Capture Platform
  description: >-
    Configurable lead-capture widgets that customers publish and install on
    permitted websites with one script tag, with a hardened cross-origin
    submission path, collaborative lead inbox, and funnel analytics.
  authoritative_reference: Embeddable_Widget_Lead_Capture_Blueprint.md
  license: MIT
  repository: TBD # filled_in_by: Stage 14
  stage_completed: 11
  stages_total: 16

# -----------------------------------------------------------------------------
# Commands a clean-machine evaluator will run, in order.
# -----------------------------------------------------------------------------
commands:
  install:
    command: npm ci
    description: Install all npm workspace dependencies from the repository root.
  run:
    command: docker compose up --build
    description: >-
      One command bringing up server (3000), web (5173), separate-origin demo
      (5174), MongoDB as a single-member replica set (27017), Redis (6379), and
      Mailpit (SMTP 1025, web UI 8025). Requires only Docker; no external
      provider credentials.
  seed:
    command: npm run seed
    description: >-
      Verifies the MongoDB connection and reports whether transactions are
      available. There is no domain data to seed until Stage 2; the command
      exists now so later stages extend it rather than invent it.
  test:
    command: npm run test
    description: >-
      Unit tests, no infrastructure required (347 tests as of Stage 11),
      including the complete section 11 authorization matrix. Integration and
      browser E2E are separate commands.
  test_unit:
    command: npm run test
  test_integration:
    command: npm run test:integration
    description: >-
      Tenancy, auth, workspace/RBAC, widgets, submissions, and the contact
      inbox, delivery, analytics, consent, retention, and the OpenAPI contract
      against real MongoDB, Redis, and Mailpit (303 tests as of Stage 12a).
      Needs `docker compose up -d --wait mongo redis mailpit`.
  test_e2e:
    command: npm run test:e2e
    description: >-
      Browser journeys plus axe accessibility checks against WCAG 2.2 AA,
      driven through the real UI (142 tests as of Stage 12a). Playwright starts
      the API, the dashboard, and the separate-origin demo itself; the same
      Docker services must be up.
  lint:
    command: npm run lint
  typecheck:
    command: npm run typecheck
  build:
    command: npm run build
  format_check:
    command: npm run format:check
  migrate:
    command: npm run migrate
    description: >-
      Apply committed migrations and explicit indexes. Repeatable: a second run
      applies nothing. Never runs implicitly on server boot.

# -----------------------------------------------------------------------------
# Base URLs. Local values are the planned Stage 1 topology; production values
# do not exist until deployment in Stage 14.
# -----------------------------------------------------------------------------
base_urls:
  local:
    app: http://localhost:3000
    web: http://localhost:5173
    demo_origin: http://localhost:5174
    mailpit: http://localhost:8025
    # Built in Stage 12a. Swagger UI, and the document it renders.
    api_docs: http://localhost:5173/api-reference
    openapi: http://localhost:5173/api/v1/openapi.json
    landing: http://localhost:5173/
    product_docs: http://localhost:5173/docs/install
  production:
    app: TBD # filled_in_by: Stage 14
    demo_origin: TBD # filled_in_by: Stage 14
    api_docs: TBD # filled_in_by: Stage 14 (built in Stage 12a)

# -----------------------------------------------------------------------------
# Probe endpoints. Health probes are implemented and verified; the public
# widget, submission, and event endpoints are still planned.
# -----------------------------------------------------------------------------
probe_endpoints:
  liveness:
    path: /health/live
    description: >-
      Process state only; never consults a dependency. Verified to stay 200
      while Redis is stopped.
  readiness:
    path: /health/ready
    description: >-
      Mongo and Redis connectivity. Returns 200 when ready and 503 otherwise,
      with per-dependency detail. Migration compatibility is added in Stage 2;
      optional-provider degraded-state reporting is Stage 13.
  widget_config:
    path: TBD # filled_in_by: Stage 6
    description: Published widget config with Origin check, ETag, 60s cache.
  submission:
    path: TBD # filled_in_by: Stage 7
    description: Hardened public cross-origin submission endpoint.
  interaction_events:
    path: TBD # filled_in_by: Stage 10
    description: Anonymous funnel event ingestion.

# -----------------------------------------------------------------------------
# The six mandatory acceptance probes. All are currently unproven.
# Detailed status and future transcripts live in EVIDENCE.md.
# -----------------------------------------------------------------------------
acceptance_probes:
  - id: valid-second-origin-submission
    required_proof: >-
      2xx response, durable Submission Event, visible Contact and dashboard result.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: malformed-and-oversized-input
    required_proof: Clean 4xx JSON errors, never a 500.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: burst-traffic
    required_proof: >-
      429 responses appear while a later legitimate request still succeeds.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: geo-fallback
    required_proof: >-
      Provider A down and B enriches; both down and the submission is still
      stored without geo.
    status: not_implemented
    planned_stage: 7
    command: TBD
  - id: side-effect-failure
    required_proof: >-
      Email or webhook throws and the primary submission remains successful
      and stored.
    status: not_implemented
    planned_stage: 7
    completed_stage: 9
    command: TBD
  - id: honeypot
    required_proof: >-
      Bot-like submission receives a generic outcome but creates no Contact.
    status: not_implemented
    planned_stage: 7
    command: TBD

# -----------------------------------------------------------------------------
# Honest posture of the hosted deployment.
# -----------------------------------------------------------------------------
disclosures:
  synthetic_data_only: true
  service_level_agreement: none
  hosting_may_sleep: true
  automated_cloud_backup: false
  repository_is_npm_workspaces_monorepo: true
  monorepo_caveat: >-
    The capstone brief requires one dedicated repository and warns against a
    monorepo. This project uses npm workspaces inside one dedicated repository
    because every workspace belongs to this single application. If an evaluator
    interprets "no monorepo" literally, this is a known submission risk. See
    README section 3.
