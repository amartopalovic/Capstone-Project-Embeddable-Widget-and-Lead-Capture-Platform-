# =============================================================================
# capstone.yaml - machine-readable evaluation manifest
# =============================================================================
#
# STATUS: Stage 13 complete; Stage 14 repository preparation is in progress.
# All six acceptance probes pass locally and each names the command that runs it. Install, run,
# seed, migrate, lint, typecheck, build, unit, integration, browser E2E, and the secret scan are
# REAL and verified. Render/release/recovery configuration now exists, but every production URL
# remains `TBD` until a credentialed deployment passes all five live checks.
#
# Stage 13 also corrected this file, which had been describing Stage 7 while the repository was at
# Stage 12: three probe endpoints were still `TBD` after the stages that built them, and all six
# acceptance probes still read `not_implemented` while EVIDENCE.md documented them passing. A
# machine-readable manifest that understates what works is the same defect as one that overstates
# it - both mean nobody can trust it without checking the code.
#
# A `TBD` value means the value does not exist - it is NOT a command that will
# silently fail, and it must not be executed or reported as passing.
#
# Each field carries a `filled_in_by` note naming the stage that will replace
# the placeholder with a real, verified value. The final pass happens in
# Stage 15 (evaluation evidence and portfolio release), when a clean-machine
# evaluator must be able to run every command here successfully.
# =============================================================================

schema_version: 1

project:
  name: Embeddable Widget & Lead-Capture Platform
  description: >-
    Configurable lead-capture widgets that customers publish and install on
    permitted websites with one script tag, with a hardened cross-origin
    submission path, collaborative lead inbox, and funnel analytics.
  authoritative_reference: Embeddable_Widget_Lead_Capture_Blueprint.md
  license: MIT
  repository: TBD # filled_in_by: Stage 14
  stage_completed: 13
  stages_total: 16

# -----------------------------------------------------------------------------
# Commands a clean-machine evaluator will run, in order.
# -----------------------------------------------------------------------------
commands:
  install:
    command: npm ci
    description: Install all npm workspace dependencies from the repository root.
  run:
    command: docker compose up --build
    description: >-
      One command bringing up server (3000), web (5173), separate-origin demo
      (5174), MongoDB as a single-member replica set (27017), Redis (6379), and
      Mailpit (SMTP 1025, web UI 8025). Requires only Docker; no external
      provider credentials.
  seed:
    command: npm run seed
    description: >-
      Apply migrations, then reset and reseed only the explicitly synthetic
      public DemoService workspace. Never creates or edits an ordinary workspace.
  test:
    command: npm run test
    description: >-
      Unit tests, no infrastructure required (385 tests as of Stage 13),
      including the complete section 11 authorization matrix and the Content
      Security Policy property assertions. Integration and browser E2E are
      separate commands.
  test_unit:
    command: npm run test
  test_integration:
    command: npm run test:integration
    description: >-
      Tenancy, auth, workspace/RBAC, widgets, submissions, and the contact
      inbox, delivery, analytics, consent, retention, and the OpenAPI contract
      against real MongoDB, Redis, and Mailpit (328 tests as of Stage 13).
      Needs `docker compose up -d --wait mongo redis mailpit`.
  test_e2e:
    command: npm run test:e2e
    description: >-
      Browser journeys plus axe accessibility checks against WCAG 2.2 AA,
      driven through the real UI (164 tests as of Stage 14 preparation). Playwright starts
      the API, the dashboard, and the separate-origin demo itself; the same
      Docker services must be up.
  lint:
    command: npm run lint
  typecheck:
    command: npm run typecheck
  build:
    command: npm run build
  format_check:
    command: npm run format:check
  migrate:
    command: npm run migrate
    description: >-
      Apply committed migrations and explicit indexes. Repeatable: a second run
      applies nothing. Never runs implicitly on server boot.
  release:
    command: npm run release
    description: >-
      Run the compiled migration and synthetic-sandbox seed entrypoints. Render
      runs this explicit, repeatable release step before the production process.
  backup_export:
    command: npm run backup:export
    description: >-
      Stream a MongoDB gzip archive through authenticated AES-256-GCM encryption.
      Requires the Stage 14 operator variables documented in .env.example.
  backup_restore_rehearsal:
    command: npm run backup:restore
    description: >-
      Restore only into a distinct database ending in _restore_rehearsal. The
      command authenticates the complete backup before mutation and refuses the
      source database as a target.
  deployment_public_checks:
    command: npm run verify:deployment
    description: >-
      Verify deployed readiness, React and API-doc surfaces, the separate demo,
      cross-origin widget configuration, and a real sandbox submission. Requires
      PRODUCTION_URL and DEMO_URL.

# -----------------------------------------------------------------------------
