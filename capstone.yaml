    web: http://localhost:5173
    # The public sandbox (blueprint 14.3), built in Stage 12b.
    demo_origin: http://localhost:5174
    demo_fixture: http://localhost:5174/fixture.html
    mailpit: http://localhost:8025
    # Built in Stage 12a. Swagger UI, and the document it renders.
    api_docs: http://localhost:5173/api-reference
    openapi: http://localhost:5173/api/v1/openapi.json
    landing: http://localhost:5173/
    product_docs: http://localhost:5173/docs/install
  production:
    status: awaiting_provider_credentials_and_live_gates
    app: TBD # filled_in_by: Stage 14
    demo_origin: TBD # filled_in_by: Stage 14
    api_docs: TBD # filled_in_by: Stage 14 (built in Stage 12a)

# -----------------------------------------------------------------------------
# Probe endpoints. Every one of these is implemented and verified.
# -----------------------------------------------------------------------------
probe_endpoints:
  liveness:
    path: /health/live
    description: >-
      Process state only; never consults a dependency. Verified to stay 200
      while Redis is stopped.
  readiness:
    path: /health/ready
    description: >-
      Mongo connectivity, Redis connectivity, and migration compatibility.
      Returns 200 when ready and 503 otherwise, with per-dependency detail.
      Degraded optional providers - email, geo, error monitoring - are reported
      in a separate `optional` section and can never change the status.
  widget_config:
    path: /widget/v1/config/{publicId}
    description: >-
      Published widget config with a strict Origin allowlist check, an ETag, and
      a 60-second cache. Answers cross-origin only for an allowlisted Origin.
  submission:
    path: /widget/v1/submit/{publicId}
    description: >-
      Hardened public cross-origin submission endpoint. Origin allowlist,
      platform-owned schema, 32 KB body cap, honeypot, timing heuristic, rate
      limits, workspace quota, and 24-hour idempotency.
  interaction_events:
    path: /widget/v1/events/{publicId}
    description: Anonymous funnel event ingestion; no raw IP is ever persisted.
  api_reference:
    path: /api-reference
    description: >-
      Swagger UI rendering the OpenAPI document the API generates about itself.
      Public and unauthenticated; describes shapes, never a tenant's data.
  operator_diagnostics:
    path: /api/v1/diagnostics
    description: >-
      Platform-operator view (blueprint 16.4): queue depths and oldest waiting
      age, dead letters, the Brevo daily budget, the Redis command counter,
      Mongo migration state, the last retention sweep, and the sandbox reset
      schedule. Restricted to PLATFORM_OPERATOR_EMAILS and closed to everybody
      when that list is empty; a caller who is not on it gets 404, not 403.

# -----------------------------------------------------------------------------
# The six mandatory acceptance probes. All six pass; each names the command
# that runs it. Transcripts live in EVIDENCE.md Part A.
#
# Each command builds the workspace packages first, because the integration
# tests import them from `dist` - on a fresh clone the bare vitest invocation
# would fail for a reason that has nothing to do with the probe. They also need
# `docker compose up -d --wait mongo redis mailpit`.
# -----------------------------------------------------------------------------
acceptance_probes:
  - id: valid-second-origin-submission
    required_proof: >-
      2xx response, durable Submission Event, visible Contact and dashboard result.
    status: passing
    completed_stage: 7
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 1"
  - id: malformed-and-oversized-input
    required_proof: Clean 4xx JSON errors, never a 500.
    status: passing
    completed_stage: 7
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 2"
  - id: burst-traffic
    required_proof: >-
      429 responses appear while a later legitimate request still succeeds.
    status: passing
    completed_stage: 7
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 3"
  - id: geo-fallback
    required_proof: >-
      Provider A down and B enriches; both down and the submission is still
      stored without geo.
    status: passing
    completed_stage: 7
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 4"
  - id: side-effect-failure
    required_proof: >-
      Email or webhook throws and the primary submission remains successful
      and stored. Extended in Stage 9 by delivery.integration GATE 1, which
      forces a webhook 500, a timeout, a 4xx, a blocked SSRF destination, an
      email-provider failure, and an unreachable Redis at enqueue time.
    status: passing
    completed_stage: 9
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 5"
  - id: honeypot
    required_proof: >-
      Bot-like submission receives a generic outcome but creates no Contact.
    status: passing
    completed_stage: 7
    command: >-
      npm run build:packages && npx vitest run --project integration-server
      submission.integration -t "PROBE 6"

# -----------------------------------------------------------------------------
# Honest posture of the hosted deployment.
# -----------------------------------------------------------------------------
disclosures:
  synthetic_data_only: true
  service_level_agreement: none
  hosting_may_sleep: true
  automated_cloud_backup: false
  repository_is_npm_workspaces_monorepo: true
  monorepo_caveat: >-
    The capstone brief requires one dedicated repository and warns against a
    monorepo. This project uses npm workspaces inside one dedicated repository
    because every workspace belongs to this single application. If an evaluator
    interprets "no monorepo" literally, this is a known submission risk. See
    README section 3.
