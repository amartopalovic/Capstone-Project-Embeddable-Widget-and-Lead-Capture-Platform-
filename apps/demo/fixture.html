<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget isolation fixture</title>
    <link rel="stylesheet" href="/src/fixture.css" />

    <!--
      The widget ISOLATION FIXTURE, not the public sandbox.

      This page moved off `/` in Stage 12b, when the sandbox became a real
      visitor-facing thing. It stays because it is what the Stage 6 runtime
      tests need and the sandbox cannot be: a deliberately awful host page.

      The hostile CSS itself lives in `src/fixture.css`, linked above - see
      that file for what it does and why it is not a `<style>` block.
    -->
  </head>
  <body>
    <main class="host-shell">
      <h1>Northwind Supply</h1>
      <p class="note" id="origin-note"></p>

      <div class="panel" data-testid="host-panel">
        A host-page element using the class name <code>.panel</code>, which the widget also uses
        internally. It must keep these styles.
      </div>

      <p>
        <button type="button" id="host-button" data-testid="host-button">A host page button</button>
      </p>

      <div id="widgets"></div>

      <div class="tall" data-testid="tall-section">
        <p class="note">A long section, so scroll-depth triggers have somewhere to go.</p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
